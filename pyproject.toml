[project]
name = "snapdeck"
version = "0.1.0"
description = "Turn a spreadsheet into a finished, narrated slide deck or one-pager in seconds — a small demo of a self-serve reports-automation trial experience."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "openai>=1.30",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
